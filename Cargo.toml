[workspace]
resolver = "2"
members = ["crates/glitu", "crates/glitu-core", "crates/glitu-web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Without debug symbols: the distributed binary goes from 22 to 18 MB
strip = true

# The web engine is small and often reloaded: optimise it for size
[profile.release.package.glitu-web]
opt-level = "s"
