# glitu's pipeline, run by the maintainer's CI (gitlab-ci-local and podman), not by GitHub: GitHub
# only receives the code, the releases and the website.
#
# - every push: tools/ci.sh (lints, tests, smoke test of the binary);
# - main and vX.Y.Z[-rc.N] tags: the four release binaries (static Linux x86_64 and ARM, macOS ARM,
#   Windows x86_64), then tools/github-release.sh: main pushed to GitHub, and the release
#   v<version> of Cargo.toml with the binaries, if it does not exist yet (raising the version and
#   pushing main is enough to release; a pushed tag must match the version);
# - main: the website (tools/site.sh), pushed to the gh-pages branch that GitHub Pages serves
#   (tools/github-pages.sh);
# - release/… branches: the binaries only, nothing published.
#
# Secret: GITHUB_TOKEN, a token allowed to push to skemonet/glitu and to create its releases, in
# the CI's variables of the repository (main and tags).

stages:
  - check
  - build
  - publish

default:
  image: localhost/ci/rust:1.99.1-4

variables:
  CARGO_TERM_COLOR: always
  GITHUB_REPO: skemonet/glitu

check:
  stage: check
  script:
    # the commit tested (the publication jobs push it to GitHub: they need the repository's history)
    - git log -1 --format='%H %s' || echo "no git history in the job"
    - tools/ci.sh

binaries:
  stage: build
  needs: [check]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
    # a release/… branch builds the binaries without publishing anything: to check them first
    - if: $CI_COMMIT_BRANCH =~ /^release\//
  script:
    # cargo-zigbuild: zig links every target; the asset is the file name in the release, the same
    # from one version to the next, so that releases/latest/download/<asset> is a stable link
    - |
      set -eu
      mkdir -p dist
      for spec in \
        x86_64-unknown-linux-musl:glitu:glitu-linux-x86_64 \
        aarch64-unknown-linux-musl:glitu:glitu-linux-arm64 \
        aarch64-apple-darwin:glitu:glitu-macos-arm64 \
        x86_64-pc-windows-gnu:glitu.exe:glitu-windows-x86_64.exe
      do
        target=${spec%%:*}; rest=${spec#*:}; exe=${rest%%:*}; asset=${rest#*:}
        echo "== $target → $asset"
        cargo zigbuild --release --locked -p glitu --target "$target"
        cp "target/$target/release/$exe" "dist/$asset"
      done
    # the binary of this machine starts and says its version
    - dist/glitu-linux-x86_64 --version
    - ls -l dist
    - (cd dist && sha256sum glitu-*)
  artifacts:
    paths:
      - dist/

github:
  stage: publish
  needs: [binaries]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  script:
    - tools/github-release.sh

website:
  stage: publish
  # after the binaries: two release builds at once would not fit in the CI's memory
  needs: [binaries]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - cargo build --release --locked -p glitu
    - tools/site.sh site/dist
    - tools/github-pages.sh site/dist
