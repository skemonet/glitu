# glitu's pipeline, run by the maintainer's CI (gitlab-ci-local and podman), not by GitHub: GitHub
# only receives the code, the releases and the website.
#
# - other branches: tools/ci.sh --quick (lints and tests);
# - main: tools/ci.sh (lints, tests, smoke test of the binary); tools/next-version.sh reads the
#   commits since the last release (conventional commits: feat, fix, perf, `!`); then, if they call
#   for a release, the five binaries (static Linux x86_64 and ARM, macOS ARM and Intel, Windows x86_64)
#   and the three of glitu-play (Linux x86_64 and ARM, Windows x86_64);
#   tools/github-release.sh pushes main to GitHub, and the tag and the release with the binaries;
#   last, the website (tools/site.sh), pushed to the gh-pages branch that GitHub Pages serves
#   (tools/github-pages.sh).
#
# Cache: target/ and the cargo registry live in podman volumes kept from one pipeline to the next
# (gitlab-ci-local --mount-cache, enabled by .gitlab-ci-local-env); a new image starts new ones.
# To clear the cache: change the -cN suffix of the keys (ci-cleanup removes the old volumes).
#
# Secret: GITHUB_TOKEN, a token allowed to push to skemonet/glitu and to create its releases, in
# the CI's variables of the repository.

stages:
  - check
  - build
  - publish

default:
  image: localhost/ci/rust:1.99.1-5
  cache:
    - key: target-rust-1.99.1-5-c1
      paths: [target]
    - key: cargo-rust-1.99.1-5-c1
      paths: [.cargo-home]

variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: $CI_PROJECT_DIR/.cargo-home
  GITHUB_REPO: skemonet/glitu

quick-check:
  stage: check
  rules:
    - if: $CI_COMMIT_BRANCH != "main"
  script:
    - tools/ci.sh --quick

check:
  stage: check
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - tools/ci.sh

version:
  stage: check
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  cache: []
  script:
    - tools/next-version.sh release.env
  artifacts:
    paths:
      - release.env

binaries:
  stage: build
  needs: [check, version]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    # cargo-zigbuild: zig links every target; the asset is the file name in the release, the same
    # from one version to the next, so that releases/latest/download/<asset> is a stable link
    - |
      set -eu
      . ./release.env
      mkdir -p dist
      touch dist/.keep
      if [ -z "$NEXT_VERSION" ]; then echo "nothing to release: no binary"; exit 0; fi
      export GLITU_BUILD_VERSION
      for spec in \
        x86_64-unknown-linux-musl:glitu:glitu-linux-x86_64 \
        aarch64-unknown-linux-musl:glitu:glitu-linux-arm64 \
        aarch64-apple-darwin:glitu:glitu-macos-arm64 \
        x86_64-apple-darwin:glitu:glitu-macos-x86_64 \
        x86_64-pc-windows-gnu:glitu.exe:glitu-windows-x86_64.exe
      do
        target=${spec%%:*}; rest=${spec#*:}; exe=${rest%%:*}; asset=${rest#*:}
        echo "== $target → $asset"
        cargo zigbuild --release --locked -p glitu --target "$target"
        cp "target/$target/release/$exe" "dist/$asset"
      done
      # glitu-play, the player for slow computers: glibc on Linux (winit opens X11, Wayland and
      # OpenGL at run time, which a static musl binary cannot), no macOS (winit links AppKit: the
      # Apple SDK is not in the image)
      for spec in \
        x86_64-unknown-linux-gnu.2.28:x86_64-unknown-linux-gnu:glitu-play:glitu-play-linux-x86_64 \
        aarch64-unknown-linux-gnu.2.28:aarch64-unknown-linux-gnu:glitu-play:glitu-play-linux-arm64 \
        x86_64-pc-windows-gnu:x86_64-pc-windows-gnu:glitu-play.exe:glitu-play-windows-x86_64.exe
      do
        target=${spec%%:*}; rest=${spec#*:}; dir=${rest%%:*}; rest=${rest#*:}; exe=${rest%%:*}; asset=${rest#*:}
        echo "== $target → $asset"
        cargo zigbuild --release --locked -p glitu-play --target "$target"
        cp "target/$dir/release/$exe" "dist/$asset"
      done
      dist/glitu-play-linux-x86_64 --version | grep -qx "glitu-play $NEXT_VERSION"
      # the binary of this machine starts and says the version released
      dist/glitu-linux-x86_64 --version | grep -qx "glitu $NEXT_VERSION"
      ls -l dist
      (cd dist && sha256sum glitu-*)
  artifacts:
    paths:
      - dist/

github:
  stage: publish
  needs: [binaries, version]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  cache: []
  script:
    - tools/github-release.sh

website:
  stage: publish
  # after the push to GitHub: the website shows what GitHub holds
  needs: [github, version]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    # the version released, or the last one: the light pages load the engine from glitu/<version>/
    - . ./release.env && export GLITU_BUILD_VERSION && tools/site.sh site/dist
    - tools/github-pages.sh site/dist
