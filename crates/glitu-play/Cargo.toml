[package]
name = "glitu-play"
description = "Native player of glitu presentations, for computers too slow for a browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
glitu-backdrop = { path = "../glitu-backdrop" }
# software rendering: the masks that reveal the arrows, the scaling of the images
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
# the text of the speaker view (already used by winit on Linux)
ab_glyph = "0.2"
png = "0.18"
# the pixels seen as bytes, for the cross-fade that vectorises (no unsafe code of our own)
bytemuck = "1"
# portable SIMD (SSE2, NEON) for the scaling: what the compiler does not vectorise alone
wide = "0.7"
serde_json = "1"
winit = "0.30"
softbuffer = "0.4"

# Wayland without winit for the slides: our own buffers, enlarged by the compositor during the
# animations (`wp_viewporter`); already used by winit, without xkbcommon (see `keymap.rs`)
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = ["calloop"] }

[lints]
workspace = true
