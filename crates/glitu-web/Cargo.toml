[package]
name = "glitu-web"
description = "In-browser presentation engine (wasm): navigation, steps, themes, terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
glitu-backdrop = { path = "../glitu-backdrop" }
wasm-bindgen = "=0.2.130"
js-sys = "0.3.107"
avt = "0.19"
serde_json = "1"
web-sys = { version = "0.3.107", features = [
  "Window", "Document", "Element", "HtmlElement", "Node", "NodeList", "DomTokenList", "CssStyleDeclaration",
  "HtmlCanvasElement", "CanvasRenderingContext2d", "HtmlCollection", "KeyboardEvent", "MouseEvent", "Event",
  "EventTarget", "Location", "History", "DomRect", "MediaQueryList", "Performance", "ResizeObserver",
  "ResizeObserverEntry", "CustomEvent", "CustomEventInit", "SvgElement", "SvgGraphicsElement", "SvgPathElement",
  "HtmlImageElement", "FontFaceSet", "console", "SvgGeometryElement", "TouchEvent", "TouchList", "Touch",
  "CanvasGradient", "Url", "CssStyleDeclaration", "WheelEvent", "HtmlInputElement", "HtmlMediaElement", "HtmlVideoElement", "Navigator",
  "HtmlIFrameElement", "MessageEvent", "KeyboardEventInit", "PointerEvent", "Storage", "CanvasPattern", "AddEventListenerOptions", "SvgTextContentElement", "SvgPoint",
] }

[lints]
workspace = true
