<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>An embedded page</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a;
         font: 28px/1.4 system-ui, sans-serif; text-align: center; }
  code { font: 24px ui-monospace, monospace; background: #e2e8f0; padding: 2px 8px; border-radius: 6px; }
  h1 { font-size: 56px; margin: 0 0 12px; letter-spacing: -.02em; }
</style>
</head>
<body>
  <div>
    <h1>Any web page</h1>
    <p>live in the slide: <code>{.iframe url="…"}</code></p>
  </div>
</body>
</html>
