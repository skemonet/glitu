name: Release
# Publishes a GitHub release of the `glitu` binary. For now a single platform, Linux x86_64 (a
# static musl binary), to keep the Actions minutes low; no tests here: run `tools/ci.sh` before
# merging. The asset is the binary itself, its SHA-256 in the release's description. The version
# is the workspace's (Cargo.toml): the binary prints it, and `--assets <url>` pages aim at that version of
# the engine. A version containing a hyphen (0.1.1-rc.1…) gives a pre-release.
#
# - a push on main whose version has no release yet publishes `v<version>`, tag included: raising
#   the version in Cargo.toml and merging is enough;
# - a pushed vX.Y.Z[-rc.N] tag publishes that version, which must match Cargo.toml.
#
# The publication uses the repository's GITHUB_TOKEN (permission contents: write).
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Version to release, if any
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$tag" = "$GITHUB_REF_NAME" ] \
              || { echo "tag $GITHUB_REF_NAME does not match the workspace version $version" >&2; exit 1; }
          fi
          release=true
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag is already released: nothing to publish"
            release=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # wasm32: the web engine, compiled by build.rs and embedded in the binary
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl, wasm32-unknown-unknown
      # psm (pest's growable stack, through skemo's layout library) assembles native code
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p glitu --target x86_64-unknown-linux-musl
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/glitu dist/glitu-linux-x86_64
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          # the description: what to download, and the SHA-256 of the binary on one line
          {
            echo "For now, one binary: Linux, Intel or AMD (\`glitu-linux-x86_64\`, static). Download it, make it executable, run it."
            echo
            echo "In one line: \`curl -fsSL https://raw.githubusercontent.com/skemonet/glitu/main/tools/install.sh | sh\`"
            echo
            echo "Check it against its line below (\`sha256sum -c\`)."
            echo "Start with \`glitu init talk && glitu serve talk/slides.md\`."
            echo
            echo '```'
            (cd dist && sha256sum glitu-*)
            echo '```'
          } > notes.md
          # the tag is created on this commit if it does not exist yet (a push on main)
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "glitu $TAG" --notes-file notes.md $pre
